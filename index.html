<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>田曦薇 × GUCCI 应援企划</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#6e3b21;
    --wood-deep:#4a2614;
    --shearling:#efe2c4;
    --cream:#f5eee0;
    --paper:#fbf7ef;
    --ink:#1d1410;
    --ink-soft:#5a4a3e;
    --line:#e0d2b8;
    --gold:#b8893b;
    --denim:#5d7a96;
    --radius:2px;
    --zh:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  :root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',var(--zh),system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  a{color:inherit;}
  button:focus-visible,a:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .wrap{max-width:620px;margin:0 auto;position:relative;}

  /* Hero */
  .hero{position:relative; background:linear-gradient(160deg,var(--wood) 0%,var(--wood-deep) 100%); overflow:hidden; min-height:360px;}
  .hero img{width:100%; display:block; height:420px; object-fit:cover; object-position:50% 12%;}
  .hero-scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(29,20,16,0) 0%, rgba(29,20,16,.1) 45%, rgba(29,20,16,.9) 100%);}
  .hero-content{position:absolute; left:0; right:0; bottom:0; padding:20px 24px 22px;}
  .hero-eyebrow{color:#e3cf9f; font-size:12px; letter-spacing:.08em; margin:0 0 8px; font-weight:600;}
  .hero-h1{font-family:'Newsreader',Georgia,var(--zh),serif; font-weight:500; color:#fbf7ef; font-size:34px; line-height:1.1; margin:0 0 8px;}
  .hero-h1 .x{font-style:italic; color:#e3cf9f; margin:0 .18em; font-weight:400;}
  .hero-sub{color:#d8c7a4; font-size:13px; margin:0; line-height:1.5;}
  .hero-meta{color:#efe2c4; font-family:'Newsreader',serif; font-style:italic; font-size:14px; margin:10px 0 0;}
  .lang-toggle{position:absolute; top:14px; right:14px; display:flex; border:1px solid rgba(255,255,255,.35); border-radius:20px; overflow:hidden; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:2;}
  .lang-toggle button{background:rgba(29,20,16,.45); color:#e3cf9f; border:none; font-size:11.5px; font-weight:600; padding:7px 13px; cursor:pointer; font-family:inherit;}
  .lang-toggle button.active{background:var(--shearling); color:var(--ink);}

  /* Phase tabs */
  .phase-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:16px 16px 14px; background:var(--paper); border-bottom:1px solid var(--line);}
  .phase-tab{border:1px solid var(--line); background:var(--cream); color:var(--ink); border-radius:12px; padding:11px 6px 10px; cursor:pointer; font-family:inherit; text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .phase-tab .ico{font-size:17px; line-height:1;}
  .phase-tab .nm{font-size:13.5px; font-weight:700;}
  .phase-tab .dt{font-size:11px; color:var(--ink-soft);}
  .phase-tab .live{font-size:10px; font-weight:700; color:#fff; background:var(--gold); border-radius:10px; padding:1px 7px; margin-top:2px;}
  .phase-tab.active{background:var(--wood-deep); border-color:var(--wood-deep); color:var(--paper);}
  .phase-tab.active .dt{color:#d8c7a4;}

  .stat-strip{display:flex; border-bottom:1px solid var(--line); background:var(--paper);}
  .stat-cell{flex:1; text-align:center; padding:14px 6px; border-right:1px solid var(--line);}
  .stat-cell:last-child{border-right:none;}
  .stat-num{font-family:'Newsreader',serif; font-size:23px; font-weight:600; display:block; line-height:1;}
  .stat-label{font-size:11px; color:var(--ink-soft); margin-top:5px; display:block;}

  .section-head{display:flex; align-items:baseline; justify-content:space-between; padding:22px 20px 10px; gap:10px;}
  .section-title{font-family:'Newsreader',Georgia,var(--zh),serif; font-size:20px; margin:0; font-weight:500;}
  .section-note{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

  .filter-row{display:flex; gap:6px; padding:0 20px 14px; flex-wrap:wrap;}
  .filter-chip{border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-size:11.5px; padding:6px 12px; border-radius:20px; cursor:pointer; font-family:inherit;}
  .filter-chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .post-list{padding:0 20px 6px; display:flex; flex-direction:column; gap:10px;}
  .post-card{border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; background:var(--paper); position:relative;}
  .post-card.done{opacity:.55;}
  .post-top{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .plat-badge{font-size:10px; font-weight:700; padding:3px 7px; border-radius:3px; background:var(--ink); color:var(--paper); flex-shrink:0;}
  .phase-badge{font-size:10px; font-weight:600; padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--ink-soft); flex-shrink:0;}
  .phase-badge.main{border-color:var(--gold); color:var(--wood);}
  .post-account{font-size:13.5px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pin-mark{font-size:13px; line-height:1; flex-shrink:0;}
  .post-note{font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}
  .post-actions{display:flex; gap:8px; align-items:center;}
  .btn{flex:1; font-family:inherit; font-size:12.5px; font-weight:600; padding:9px 13px; border-radius:3px; border:1px solid var(--ink); cursor:pointer; text-decoration:none; text-align:center; background:var(--ink); color:var(--paper); display:inline-flex; align-items:center; justify-content:center;}
  .btn:active{opacity:.7;}
  .done-toggle{width:38px; height:38px; flex-shrink:0; border-radius:3px; border:1px solid var(--line); background:var(--cream); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--ink-soft);}
  .done-toggle.checked{background:var(--denim); border-color:var(--denim); color:#fff;}
  .empty-state{padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.7;}

  footer{text-align:center; padding:22px 20px 34px; font-size:11.5px; color:var(--ink-soft); line-height:1.7;}
  ::selection{background:var(--gold); color:#fff;}
  .post-card{cursor:pointer;}
  /* Sheet */
  .sheet-bg{position:fixed; inset:0; background:rgba(29,20,16,.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .sheet-bg.open{display:flex;}
  .sheet{background:var(--cream); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:22px 22px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out;}
  @media (min-width:600px){ .sheet-bg{align-items:center;} .sheet{border-radius:22px;} }
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .sheet-head .plat-badge{font-size:11px; padding:5px 8px;}
  .sheet-acc{font-weight:700; font-size:15.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sheet-x{width:32px; height:32px; border-radius:50%; border:none; background:var(--line); color:var(--ink); font-size:16px; cursor:pointer;}
  .box{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
  .box-head{display:flex; align-items:center; gap:6px; margin-bottom:9px;}
  .box-label{font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--ink-soft); flex:1;}
  .mini{font-family:inherit; font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--cream); color:var(--ink); cursor:pointer;}
  .tags{font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word;}
  .cap{font-size:14px; line-height:1.6;}
  .big-rand{width:100%; font-family:inherit; font-size:14px; font-weight:600; padding:14px; border-radius:10px; border:1px dashed var(--gold); background:var(--cream); color:var(--wood); cursor:pointer;}
  .copy-all{width:100%; font-family:inherit; font-size:14px; font-weight:700; padding:13px; border-radius:12px; border:none; background:var(--line); color:var(--ink); cursor:pointer; margin-bottom:10px;}
  .sheet-actions{display:flex; gap:10px;}
  .sheet-actions a,.sheet-actions button{flex:1; font-family:inherit; font-size:14.5px; font-weight:700; padding:14px; border-radius:12px; border:none; text-align:center; text-decoration:none; cursor:pointer;}
  .go-post{background:linear-gradient(120deg,var(--wood) 0%,var(--gold) 100%); color:#fff;}
  .mark-done{background:var(--denim); color:#fff;}
  .mark-done.is-done{background:var(--line); color:var(--ink);}
  .tips{font-size:11.5px; color:var(--ink-soft); line-height:1.75; text-align:center; margin:14px 0 2px;}
  .toast{position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); font-size:13px; font-weight:600; padding:10px 18px; border-radius:20px; opacity:0; transition:.2s; z-index:60; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%);}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>
</head>

    titleZh:'田曦薇<span class="x">×</span>GUCCI', titleEn:'TIAN XIWEI<span class="x">×</span>GUCCI',
    subtitleZh:"陪田曦薇走完米兰时装周的每一则贴文", subtitleEn:"Cheering for Tian Xiwei, one post at a time",
    periodZh:"粉丝应援企划", periodEn:"Fan Engagement Project",
    metaZh:"米兰 · 9月23日 – 9月25日", metaEn:"Milan, September 23 – 25"
  };

  // ③ 两个阶段（日期为当地时间，用于显示“进行中”）
  var PHASES = [
    {id:"pre",  icon:"✈️", zh:"Pre Show",  en:"Pre Show",  dZh:"9月23日 – 24日", dEn:"23 – 24 Sep", start:"2026-09-23", end:"2026-09-24"},
    {id:"main", icon:"👠", zh:"Main Show", en:"Main Show", dZh:"9月25日", dEn:"25 Sep", start:"2026-09-25", end:"2026-09-25"}
  ];

  var posts = [];
  var lastUpdated = null;
  var loadError = false;
  var activeFilter = "all";
  var activePhase = "all";
  var lang = "zh";
  try{
    var saved = localStorage.getItem("txw_lang");
    if(saved==="zh"||saved==="en") lang = saved;
  }catch(e){}

  var myDone = {};
  try{
    var savedDone = JSON.parse(localStorage.getItem("txw_my_done") || "{}");
    if(savedDone && typeof savedDone === "object") myDone = savedDone;
  }catch(e){}
  function postKey(p){
    var s = p.phase+"||"+p.platform+"||"+p.account+"||"+p.link;
    var h = 5381;
    for(var i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }
  function toggleMyDone(key){
    myDone[key] = !myDone[key];
    try{ localStorage.setItem("txw_my_done", JSON.stringify(myDone)); }catch(e){}
    render();
  }

  var platformOrder = ["X","IG","TT","FB","YT","WB","DY","TH","XHS","其他"];

  var STR = {
    zh:{
      statTotal:"总任务", statDone:"已完成", statPending:"待应援",
      sectionTitle:"应援任务", updatedAt:"更新于 ", filterAll:"全部平台",
      phaseAll:"全部", phaseAllSub:"整个企划", live:"进行中",
      goEngage:"前往互动",
      hashtags:"HASHTAGS", copyTags:"复制 Hashtag", randCap:"随机文案", randomize:"换一则", copyMsg:"复制文案",
      copyAll:"复制文案 + Hashtag", goPost:"🍩 去发文！", markDoneBtn:"✓ 完成", undoDone:"↺ 取消完成",
      copied:"已复制 ✓", copyFail:"复制失败，请长按手动复制",
      tips:"❤️ 按赞、转发和收藏<br>📝 复制文案 → 贴在留言区，并 tag @gucci @vv.tian<br>📱 文案 + # → 发贴文 / Reels（分享并收藏 ✨）<br>#️⃣ 只复制 # → 贴在限动（效果更好）",
      markDone:"标记我已完成",
      emptyView:"这个阶段还没有任务，请稍候管理员更新。",
      noSheet:"任务表还没连接，管理员设置好后这里会显示任务。",
      loadErr:"读取任务清单失败，请稍后重新整理。",
      footer1:"田曦薇应援企划 · 粉丝自发整理维护 · @myuniverse9363"
    },
    en:{
      statTotal:"Total", statDone:"Done", statPending:"Pending",
      sectionTitle:"Engagement Tasks", updatedAt:"Updated ", filterAll:"All platforms",
      phaseAll:"All", phaseAllSub:"Whole campaign", live:"Live now",
      goEngage:"Engage",
      hashtags:"HASHTAGS", copyTags:"Copy Hashtags", randCap:"Random Caption", randomize:"Randomize", copyMsg:"Copy Message",
      copyAll:"Copy Message + Hashtags", goPost:"🍩 Go post!", markDoneBtn:"✓ Done", undoDone:"↺ Undo",
      copied:"Copied ✓", copyFail:"Copy failed, long-press to copy",
      tips:"❤️ Like, Repost & Save<br>📝 Copy message → paste as a comment with @gucci @vv.tian<br>📱 Message + # → create a Post / Reels (share and save ✨)<br>#️⃣ Copy # only → paste in Stories (more impact)",
      markDone:"Mark as done",
      emptyView:"No tasks for this phase yet. Check back soon.",
      noSheet:"The task sheet isn't connected yet. Tasks will appear here once it is.",
      loadErr:"Couldn't load the task list. Try refreshing.",
      footer1:"Tian Xiwei Fan Project · Maintained by fans · @myuniverse9363"
    }
  };
  function t(key){ return STR[lang][key]; }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(ts){
    if(!ts) return "";
    var d = new Date(ts);
    var hh = String(d.getHours()).padStart(2,"0"), mi = String(d.getMinutes()).padStart(2,"0");
    return (d.getMonth()+1)+"/"+d.getDate()+" "+hh+":"+mi;
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function isLive(ph){ var s = todayStr(); return s >= ph.start && s <= ph.end; }

  function normPhase(v){
    v = (v||"").trim().toLowerCase();
    if(/^pre|预热|預熱/.test(v)) return "pre";
    if(/^main|^show|正式|主秀/.test(v)) return "main";
    return "";
  }

  function parseCsv(text){
    var rows = [], row = [], field = "", inQuotes = false;
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else{ inQuotes = false; }
        } else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ }
        else{ field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  // ---------- 从链接自动侦测平台和帐号 ----------
  var HOSTS = [
    [/(^|\.)instagram\.com$|(^|\.)instagr\.am$/, "IG"],
    [/(^|\.)(x|twitter)\.com$/, "X"],
    [/(^|\.)tiktok\.com$/, "TT"],
    [/(^|\.)(facebook|fb)\.com$|(^|\.)fb\.watch$/, "FB"],
    [/(^|\.)youtube\.com$|(^|\.)youtu\.be$/, "YT"],
    [/(^|\.)weibo\.(com|cn)$/, "WB"],
    [/(^|\.)douyin\.com$|(^|\.)iesdouyin\.com$/, "DY"],
    [/(^|\.)threads\.(net|com)$/, "TH"],
    [/(^|\.)xiaohongshu\.com$|(^|\.)xhslink\.com$/, "XHS"]
  ];
  function parseUrl(link){
    try{ return new URL(/^https?:\/\//i.test(link) ? link : "https://"+link); }catch(e){ return null; }
  }
  function detectPlatform(link){
    var u = parseUrl(link); if(!u) return "其他";
    var h = u.hostname.toLowerCase();
    for(var i=0;i<HOSTS.length;i++){ if(HOSTS[i][0].test(h)) return HOSTS[i][1]; }
    return "其他";
  }
  function detectAccount(link){
    var u = parseUrl(link); if(!u) return "";
    var pl = detectPlatform(link);
    var seg = u.pathname.split("/").filter(Boolean).map(function(x){ try{return decodeURIComponent(x);}catch(e){return x;} });
    var first = seg[0] || "";
    if(first.charAt(0)==="@") return first;                       // TikTok / Threads / YouTube @handle
    if(pl==="X"){
      if(first && !/^(i|intent|home|search|hashtag|share)$/i.test(first)) return "@"+first;
    }
    if(pl==="IG"){
      if(first==="stories" && seg[1]) return "@"+seg[1];
      if(first && !/^(p|reel|reels|tv|explore|share|s)$/i.test(first)) return "@"+first;
    }
    if(pl==="FB"){
      if(first && !/^(watch|share|reel|story\.php|permalink\.php|photo|photo\.php|groups|events|videos|profile\.php)$/i.test(first)) return first;
    }
    return "";
  }

  var PLAT_NAMES = {IG:"Instagram",X:"X",TT:"TikTok",FB:"Facebook",YT:"YouTube",WB:"微博",DY:"抖音",TH:"Threads",XHS:"小红书"};
  function accLabel(p){
    if(p.account) return p.account;
    var n = PLAT_NAMES[p.platform] || "";
    return lang==="zh" ? (n ? n+" 贴文" : "贴文") : ((n==="微博"?"Weibo":n==="抖音"?"Douyin":n==="小红书"?"RED":n) + " post").trim();
  }

  function rowsToPosts(rows, sheetPhase){
    if(rows.length < 1) return [];
    var hdr = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var idx = {};
    hdr.forEach(function(h,i){ idx[h] = i; });
    var out = [];
    for(var r=1; r<rows.length; r++){
      var row = rows[r];
      if(!row || row.every(function(c){return !c || !c.trim();})) continue;
      var account = (row[idx.account]||"").trim();
      var link = (row[idx.link]||"").trim();
      if(!account && !link) continue;
      out.push({
        platform: (row[idx.platform]||"").trim() || detectPlatform(link),
        account: account || detectAccount(link),
        link: link,
        note: (row[idx.note]||"").trim(),
        pinned: /^true$/i.test((row[idx.pinned]||"").trim()),
        hashtags: (row[idx.hashtags]||"").trim(),
        favorite: /^true$/i.test((row[idx.favorite]||row[idx.favor]||"").trim()),
        done: /^true$/i.test((row[idx.done]||"").trim()),
        phase: sheetPhase || normPhase(row[idx.phase]),
        addedAt: r
      });
    }
    return out;
  }

  function setLang(l){
    lang = l;
    try{ localStorage.setItem("txw_lang", l); }catch(e){}
    render();
  }

  function renderPhases(){
    var html = [
      '<button class="phase-tab'+(activePhase==="all"?" active":"")+'" data-p="all">'+
        '<span class="ico">✦</span><span class="nm">'+t("phaseAll")+'</span><span class="dt">'+t("phaseAllSub")+'</span></button>'
    ];
    PHASES.forEach(function(ph){
      html.push(
        '<button class="phase-tab'+(activePhase===ph.id?" active":"")+'" data-p="'+ph.id+'">'+
          '<span class="ico">'+ph.icon+'</span>'+
          '<span class="nm">'+(lang==="zh"?ph.zh:ph.en)+'</span>'+
          '<span class="dt">'+(lang==="zh"?ph.dZh:ph.dEn)+'</span>'+
          (isLive(ph)?'<span class="live">'+t("live")+'</span>':'')+
        '</button>'
      );
    });
    var row = document.getElementById("phaseRow");
    row.innerHTML = html.join("");
    row.querySelectorAll(".phase-tab").forEach(function(el){
      el.onclick = function(){ activePhase = el.getAttribute("data-p"); activeFilter = "all"; render(); };
    });
  }

  function render(){
    document.documentElement.lang = lang==="zh" ? "zh-Hans" : "en";
    document.querySelectorAll("#langToggle button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-lang")===lang);
    });
    document.getElementById("titleText").innerHTML = lang==="zh" ? header.titleZh : header.titleEn;
    document.getElementById("subtitleText").textContent = lang==="zh" ? header.subtitleZh : header.subtitleEn;
    document.getElementById("periodText").textContent = lang==="zh" ? header.periodZh : header.periodEn;
    document.getElementById("metaText").textContent = lang==="zh" ? header.metaZh : header.metaEn;

    document.getElementById("statTotalLabel").textContent = t("statTotal");
    document.getElementById("statDoneLabel").textContent = t("statDone");
    document.getElementById("statPendingLabel").textContent = t("statPending");
    document.getElementById("sectionTitle").textContent = t("sectionTitle");
    document.getElementById("footerText").textContent = t("footer1");

    renderPhases();

    var inPhase = activePhase==="all" ? posts : posts.filter(function(p){ return p.phase===activePhase; });
    var sorted = inPhase.slice().sort(function(a,b){
      var aDone = a.done || !!myDone[postKey(a)];
      var bDone = b.done || !!myDone[postKey(b)];
      if(aDone !== bDone) return aDone ? 1 : -1;
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      if(!!a.favorite !== !!b.favorite) return a.favorite ? -1 : 1;
      return a.addedAt - b.addedAt;
    });
    var total = sorted.length;
    var done = sorted.filter(function(p){return p.done || !!myDone[postKey(p)];}).length;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statPending").textContent = total - done;
    document.getElementById("lastUpdated").textContent = lastUpdated ? (t("updatedAt")+fmtDate(lastUpdated)) : "";

    var platformsPresent = {};
    sorted.forEach(function(p){ platformsPresent[p.platform] = true; });
    var chips = ['<button class="filter-chip'+(activeFilter==="all"?" active":"")+'" data-f="all">'+t("filterAll")+'</button>'];
    platformOrder.forEach(function(pl){
      if(platformsPresent[pl]){
        chips.push('<button class="filter-chip'+(activeFilter===pl?" active":"")+'" data-f="'+pl+'">'+pl+'</button>');
      }
    });
    document.getElementById("filterRow").innerHTML = chips.join("");

    var visible = activeFilter==="all" ? sorted : sorted.filter(function(p){return p.platform===activeFilter;});
    var listEl = document.getElementById("postList");
    if(!CSV_URLS.pre && !CSV_URLS.main){
      listEl.innerHTML = '<div class="empty-state">'+t("noSheet")+'</div>';
    } else if(loadError){
      listEl.innerHTML = '<div class="empty-state">'+t("loadErr")+'</div>';
    } else if(visible.length===0){
      listEl.innerHTML = '<div class="empty-state">'+t("emptyView")+'</div>';
    } else {
      listEl.innerHTML = visible.map(function(p){
        var key = postKey(p);
        var checked = !!myDone[key];
        var eff = p.done || checked;
        var ph = null;
        PHASES.forEach(function(x){ if(x.id===p.phase) ph = x; });
        return (
          '<div class="post-card'+(eff?" done":"")+'" data-key="'+key+'">'+
            '<div class="post-top">'+
              '<span class="plat-badge">'+escapeHtml(p.platform)+'</span>'+
              '<span class="post-account">'+escapeHtml(accLabel(p))+'</span>'+
              (activePhase==="all" && ph ? '<span class="phase-badge '+ph.id+'">'+(lang==="zh"?ph.zh:ph.en)+'</span>' : '')+
              (p.pinned? '<span class="pin-mark" title="置顶">📌</span>' : '')+
              (p.favorite? '<span class="pin-mark" title="推荐">⭐️</span>' : '')+
            '</div>'+
            (p.note? '<p class="post-note">'+escapeHtml(p.note)+'</p>' : '')+
            '<div class="post-actions">'+
              '<button class="btn open-sheet" data-key="'+key+'">'+t("goEngage")+'</button>'+
              '<button class="done-toggle'+(checked?" checked":"")+'" data-key="'+key+'" title="'+t("markDone")+'" aria-label="'+t("markDone")+'">'+(checked?"✓":"☐")+'</button>'+
            '</div>'+
          '</div>'
        );
      }).join("");
    }
    document.querySelectorAll(".filter-chip").forEach(function(el){
      el.onclick = function(){ activeFilter = el.getAttribute("data-f"); render(); };
    });
    document.querySelectorAll(".done-toggle").forEach(function(el){
      el.onclick = function(e){ e.stopPropagation(); toggleMyDone(el.getAttribute("data-key")); };
    });
    document.querySelectorAll(".post-card").forEach(function(el){
      el.onclick = function(){ openSheet(el.getAttribute("data-key")); };
    });
    if(sheetKey) renderSheet();
  }

  document.querySelectorAll("#langToggle button").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
  });

  // 默认打开当天进行中的阶段
  PHASES.forEach(function(ph){ if(isLive(ph)) activePhase = ph.id; });

  // ---------- 弹窗 ----------
  var sheetKey = null, curCaption = "";
  function findPost(key){ for(var i=0;i<posts.length;i++){ if(postKey(posts[i])===key) return posts[i]; } return null; }
  function pickCaption(){
    var list = CAPTIONS.en;
    if(list.length < 2) return list[0] || "";
    var c; do { c = list[Math.floor(Math.random()*list.length)]; } while(c === curCaption);
    return c;
  }
  function tagsOf(p){ var ph = DEFAULT_HASHTAGS[p.phase] || DEFAULT_HASHTAGS.main;
    var v = p.hashtags ? p.hashtags : (Object.prototype.hasOwnProperty.call(ph, p.platform) ? ph[p.platform] : ph._all);
    return (v || "").replace(/\\n/g,"\n"); }
  function openSheet(key){
    sheetKey = key; curCaption = "";
    document.getElementById("sheetBg").classList.add("open");
    document.body.style.overflow = "hidden";
    renderSheet();
  }
  function closeSheet(){
    sheetKey = null;
    document.getElementById("sheetBg").classList.remove("open");
    document.body.style.overflow = "";
  }
  function renderSheet(){
    var p = findPost(sheetKey);
    if(!p){ closeSheet(); return; }
    var mine = !!myDone[sheetKey];
    var tags = tagsOf(p);
    var capHtml = curCaption
      ? '<div class="box-head"><span class="box-label">'+t("randCap")+'</span>'+
          '<button class="mini" id="btnRand">↻ '+t("randomize")+'</button>'+
          '<button class="mini" id="btnCopyCap">⧉ '+t("copyMsg")+'</button></div>'+
          '<div class="cap">'+escapeHtml(curCaption)+'</div>'
      : '<div class="box-head"><span class="box-label">'+t("randCap")+'</span></div>'+
          '<button class="big-rand" id="btnRand">✨ '+t("randCap")+'</button>';
    document.getElementById("sheet").innerHTML =
      '<div class="sheet-head"><span class="plat-badge">'+escapeHtml(p.platform)+'</span>'+
        '<span class="sheet-acc">'+escapeHtml(accLabel(p))+'</span>'+
        (p.pinned?'<span class="pin-mark">📌</span>':'')+(p.favorite?'<span class="pin-mark">⭐️</span>':'')+
        '<button class="sheet-x" id="btnClose" aria-label="close">✕</button></div>'+
      (p.note?'<p class="post-note" style="margin:0 2px 12px">'+escapeHtml(p.note)+'</p>':'')+
      (tags ? '<div class="box"><div class="box-head"><span class="box-label">'+t("hashtags")+'</span>'+
        '<button class="mini" id="btnCopyTags">⧉ '+t("copyTags")+'</button></div>'+
        '<div class="tags">'+escapeHtml(tags)+'</div></div>' : '')+
      '<div class="box">'+capHtml+'</div>'+
      (curCaption && tags?'<button class="copy-all" id="btnCopyAll">⧉ '+t("copyAll")+'</button>':'')+
      '<div class="sheet-actions">'+
        '<a class="go-post" href="'+escapeHtml(p.link)+'" target="_blank" rel="noopener">'+t("goPost")+'</a>'+
        '<button class="mark-done'+(mine?" is-done":"")+'" id="btnDone">'+(mine?t("undoDone"):t("markDoneBtn"))+'</button>'+
      '</div>'+
      '<p class="tips">'+t("tips")+'</p>';

    document.getElementById("btnClose").onclick = closeSheet;
    document.getElementById("btnRand").onclick = function(){ curCaption = pickCaption(); renderSheet(); };
    var ct = document.getElementById("btnCopyTags"); if(ct) ct.onclick = function(){ copyText(tags); };
    var c1 = document.getElementById("btnCopyCap"); if(c1) c1.onclick = function(){ copyText(curCaption); };
    var c2 = document.getElementById("btnCopyAll"); if(c2) c2.onclick = function(){ copyText(curCaption+"\n\n"+tags); };
    document.getElementById("btnDone").onclick = function(){
      var wasDone = !!myDone[sheetKey];
      toggleMyDone(sheetKey);
      if(!wasDone) closeSheet();
    };
  }
  document.getElementById("sheetBg").addEventListener("click", function(e){ if(e.target.id==="sheetBg") closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && sheetKey) closeSheet(); });

  var toastTimer;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1400);
  }
  function copyText(text){
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      toast(ok ? t("copied") : t("copyFail"));
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ toast(t("copied")); }, fallback);
    } else { fallback(); }
  }

  function fetchSheet(url, phase){
    return fetch(url + (url.indexOf("?")>-1?"&":"?") + "_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.text(); })
      .then(function(text){ return rowsToPosts(parseCsv(text), phase); });
  }
  var sheetCache = {pre:[], main:[]};
  function loadData(){
    var jobs = [];
    ["pre","main"].forEach(function(ph){
      var url = CSV_URLS[ph];
      if(!url) return;
      jobs.push(fetchSheet(url, ph).then(function(list){
        list.forEach(function(p,i){ p.addedAt = (ph==="pre"?0:100000) + i; });
        sheetCache[ph] = list; return true;
      }).catch(function(err){ console.error("load failed ("+ph+")", err); return false; }));
    });
    if(!jobs.length) return;
    Promise.all(jobs).then(function(results){
      posts = sheetCache.pre.concat(sheetCache.main);
      var anyOk = results.some(function(x){ return x; });
      if(anyOk){ lastUpdated = Date.now(); loadError = false; }
      else if(posts.length===0){ loadError = true; }
      render();
    });
  }

  render();
  loadData();
  setInterval(loadData, 60000);
})();
</script>
</body>
